<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetTrainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar1" class="toolbar"></div>
  <div id="toolbar2" class="toolbar"></div>
  <div id="viewbar"></div>
  <div id="main">
    <div id="stage">
      <svg id="ws" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="phys" style="display:none"></div>
      <div id="physbar" style="display:none"><span id="physpath"></span></div>
      <div id="learn" style="display:none"></div>
      <div id="stagehint" hidden></div>
      <div id="demobanner" hidden></div>
    </div>
    <div id="side" style="display:none">
      <div id="sidegrip"></div>
      <div id="trainpanel"></div>
      <div id="simpanel"></div>
    </div>
  </div>
  <div id="timebar"></div>
  <div id="bottom">
    <div id="devtypes"></div>
    <div id="devmodels"></div>
    <div id="scenario"></div>
    <div id="pdulist"></div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/net.js"></script>
<script src="js/ios.js"></script>
<script src="js/switching.js"></script>

<script src="js/course/glossary.js"></script>
<script src="js/course/interview.js"></script>
<script src="js/course/srwe_2.js"></script>
<script src="js/course/ensa_2.js"></script>
<script src="js/course/drills.js"></script>
<script src="js/study.js"></script>
<script src="js/clihelp.js"></script>
<script src="js/demos.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/files.js"></script>

<script src="js/ui/pwa.js"></script>
